name: Test deployment tools

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wrangler:
    if: github.repository == 'tianma-if/edgeever'
    name: Wrangler runner (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Launch project-local Wrangler
        run: bun scripts/run-wrangler.mjs --version

      - name: Test deployment tooling
        run: bun test tests/wrangler-runner.test.ts tests/deployment-verify.test.ts tests/deployment-entrypoints.test.ts
